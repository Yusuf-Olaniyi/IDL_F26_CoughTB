<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 624" width="960" height="624" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' role="img" aria-labelledby="title desc">
<title id="title">Cough-audio pipeline and VGGish architecture</title>
<desc id="desc">Session recordings from four simultaneous devices are relabelled and audited, cut into single coughs with a CLAP-based extractor, converted to 64 by 97 log-mel spectrograms, balanced and augmented for training only, and resized to 96 by 64. VGGish applies six 3 by 3 convolutions with 64, 128, 256, 256, 512 and 512 channels and four max-pooling layers, then fully connected layers of 4096, 4096 and 128 units. A head of 128 to 16 to 1 units outputs a TB logit. A participant's score is the median clip probability over all clips and four inner-fold models.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#898781"/></marker></defs>
<rect width="960" height="624" rx="16" fill="#fcfcfb"/>
